<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
</head>

<body>
    <nav>
        <div class="logo"><img src="Assets/imgs/yawer-logo.png" alt="logo"></div>
        <div class="title">
            <h1>Rock Paper Scissors</h1>
            <p>first to 5 win!</p>
        </div>
        <div class="light-and-dark-mode"><img src="Assets/imgs/night-mode.png" alt="mode"></div>
    </nav>

    <div class="options">
        <h3>Choose your move</h3>
        <div class="buttons">
            <div class="option"><img src="Assets/imgs/Rock-option.png" alt="Rock option"></div>
            <div class="option"><img src="Assets/imgs/Paper-option.png" alt="Paper option"></div>
            <div class="option"><img src="Assets/imgs/Scissors-option.png" alt="Scissors option"></div>
        </div>
    </div>

    <div class="score">
        <div class="you">
            <p>You</p>
            <p>0</p>
        </div>
        <span>VS</span>
        <div class="computer">
            <p>Computer</p>
            <p>0</p>
        </div>
    </div>
</body>

</html>
