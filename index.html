<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Geist+Pixel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>RPS Game</title>
</head>
<body>
    <!--navbar-->
    <nav>
        <div class="logo">Place Holder</div>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">Rules</a></li>
            <li><a href="">About me</a></li>
        </ul>
        <div class="rps">RPS Game</div>
    </nav>
    <hr class="custom-line">
    <p class="win5">First 5 win!</p>
    <!--Choosing Your Move-->
    <div class="choosing-your-move">
        <h2>Choose Your Move Wisely!</h2>
        <p>(or you will regret)</p>
        <div class="cards">
            <div class="card">
                <img src="Assets/imgs/Skull.png" alt="Skull">
                <p>Skull (Rock)</p>
            </div>
            <div class="card">
                <img src="Assets/imgs/Eyeball.png" alt="Eyeball">
                <p>Eyeball (Paper)</p>
            </div>
            <div class="card">
                <img src="Assets/imgs/Scythe.png" alt="Scythe">
                <p>Scythe (Scissors)</p>
            </div>
        </div>
    </div>
</body>
</html>
